<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>FlowDesk – Plan, track and ship work together</title>
    <meta
      name="description"
      content="FlowDesk is the all-in-one workspace for modern teams. Plan projects, track tasks and collaborate in real time — free for teams up to 5."
    />
    <meta name="keywords" content="project management, task tracker, team collaboration, productivity, kanban" />
    <meta name="author" content="FlowDesk" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#6d5dfc" />
    <link rel="canonical" href="https://flowdesk.example.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FlowDesk – Plan, track and ship work together" />
    <meta property="og:description" content="The all-in-one workspace for modern teams." />
    <meta property="og:url" content="https://flowdesk.example.com/" />
    <meta property="og:image" content="https://flowdesk.example.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FlowDesk – Plan, track and ship work together" />
    <meta name="twitter:description" content="The all-in-one workspace for modern teams." />

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "FlowDesk",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- Fonts (preconnect + swap for performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Apply saved theme before paint to avoid a flash of the wrong theme (external file = CSP-safe) -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <noscript>Please enable JavaScript to view FlowDesk.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
