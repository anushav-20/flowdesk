# Full stack locally:  docker compose up --build
#   Web app → http://localhost:8080   API → http://localhost:4000/api   Postgres → localhost:5432
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowdesk
      POSTGRES_PASSWORD: flowdesk
      POSTGRES_DB: flowdesk
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowdesk']
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: server/Dockerfile }
    environment:
      DATABASE_URL: postgres://flowdesk:flowdesk@db:5432/flowdesk
      JWT_SECRET: local-docker-secret-please-change-0123456789abcdef
      NODE_ENV: production
      CORS_ORIGINS: http://localhost:8080
    ports: ['4000:4000']
    depends_on:
      db: { condition: service_healthy }

  seed:
    build: { context: ., dockerfile: server/Dockerfile }
    command: ['node', 'server/src/db/seed.js']
    environment:
      DATABASE_URL: postgres://flowdesk:flowdesk@db:5432/flowdesk
      JWT_SECRET: local-docker-secret-please-change-0123456789abcdef
      NODE_ENV: production
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'

  web:
    build:
      context: .
      args:
        VITE_WORKSPACE_API_URL: http://localhost:4000/api
    ports: ['8080:8080']
    depends_on: [api]

volumes:
  pgdata:
