[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: serve index.html for every route (e.g. /pricing, /blog/5)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://dummyjson.com https://api.github.com https://hooks.slack.com https://*.onrender.com wss://*.onrender.com https://api.flowdesk.example.com wss://api.flowdesk.example.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Hashed build assets never change → cache for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
